<!--
  Date format snippet
  See: ${JS_ROOT}/modules/components/locale-datetime.js
-->

<time
  {% if include.class %}
    class="{{ include.class }}"
  {% endif %}
  data-ts="{{ include.date | date: '%s' }}"
  data-df="YYYY/MM/DD HH:mm"
  {% if include.tooltip %}
    data-bs-toggle="tooltip" data-bs-placement="bottom"
  {% endif %}
>
  {{ include.date | date: "%Y/%m/%d %H:%M" }}
</time>
